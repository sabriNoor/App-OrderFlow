version: '3.8'

services:
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_consumer
    env_file:
     - .env
    environment:
      RABBITMQ_HOST: rabbitmq   
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    networks:
      - sharednet
    ports:
      - "6000:5000" 

networks:
  sharednet:
    external: true
    name: shared_network   

