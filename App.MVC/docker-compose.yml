version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Abc@123456"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  mvcapp:
    build: .
    depends_on:
      - sqlserver
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=AppMVCDb;User Id=sa;Password=Abc@123456;TrustServerCertificate=true"
    restart: always

volumes:
  sql_data:
  rabbitmq_data:
